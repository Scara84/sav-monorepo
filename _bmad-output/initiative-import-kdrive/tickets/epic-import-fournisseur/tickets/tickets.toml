[[entry]]
id = 1
type = "story"
title = "Vérifier la connexion et le dossier de départ"
description = "Client REST serveur réutilisable et diagnostic indépendant fournissant l’identifiant vérifié de FRANCAIS. Borner les délais, distinguer 429 et respecter Retry-After. Contrôler le drive, la racine et chaque parent jusqu’à FRANCAIS. Distinguer accès aux métadonnées et téléchargement témoin autorisé. Documenter la configuration locale."
verify = "Exécuter le diagnostic simulé avec succès, secret absent, 401, 403, mauvais drive, dossier absent et parent erroné. Sur compte autorisé, vérifier séparément accès au dossier et lecture témoin."
covers = ["R1", "R2", "R3"]
after = []
hitl = true
risk = "high"

