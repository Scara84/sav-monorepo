[[entry]]
id = 4
type = "story"
title = "Afficher l’aperçu automatique dans la demande en cours"
description = "Lire sav.metadata.invoice_special_mention après contrôle opérateur/groupe, y compris pour un admin. Consommer le classeur validé de la story 3. À partir de l’action de préparation dans SavDetailView, déclencher après historique vide confirmé ou régénération confirmée. Préserver la simple consultation et distinguer un échec de lecture de l’historique. Réutiliser le résultat du parseur et conserver le recours manuel."
